name: Release

# A version tag on main builds, tests and publishes the release. Building has read-only access; only
# the publish job can write, and it runs none of the repository's code.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main and matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(cargo metadata --no-deps --format-version 1 --locked |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "hopsync"))')
          test "$TAG" = "v$version"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: crates/hopsync/web/package.json
      - name: Build the UI
        working-directory: crates/hopsync/web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit
          pnpm build
      - name: Install audit and build tools
        run: |
          cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2 cargo-zigbuild@0.24.1
          pip install ziglang==0.17.1
      - name: Audit
        run: |
          cargo audit
          cargo deny check
      - name: Test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          test -x /usr/sbin/sshd
          cargo test --workspace --locked
      - name: Build the archives
        run: |
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf
          contrib/release/build.sh x86_64-unknown-linux-gnu.2.17 x86_64 dist
          contrib/release/build.sh aarch64-unknown-linux-gnu.2.17 aarch64 dist
          contrib/release/build.sh armv7-unknown-linux-gnueabihf.2.17 armv7 dist
      - name: Run them on old and current distros
        run: contrib/release/smoke-all.sh dist
      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > sha256sums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes
