[workspace]
resolver = "3"
members = ["crates/hopsync", "spikes/sftp-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
# Unsafe needs a per-item `#[allow]` with a SAFETY comment explaining why.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
