[package]
name = "sftp-bench"
description = "Phase 0 throwaway spike: SFTP throughput of candidate SSH crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
bytes = "1"
futures = "0.3"
openssh = { version = "0.11.6", default-features = false, features = ["process-mux"] }
openssh-sftp-client = { version = "0.15.11", features = ["openssh"] }
russh = { version = "0.65.0", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }

[lints]
workspace = true
