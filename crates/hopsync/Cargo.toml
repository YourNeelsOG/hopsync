[package]
name = "hopsync"
description = "Fast SSH/SFTP transfer service for seedboxes, with a web UI and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Already in the tree through russh; used directly for the vault (Decision log 2026-11-04).
aws-lc-rs = "1.19.0"
zeroize = { version = "1.9.1", features = ["serde"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
libc = "0.2.191"
rusqlite = { version = "0.41.1", features = ["bundled"] }
twox-hash = { version = "=2.1.5", default-features = false, features = ["std", "xxhash3_128"] }
russh = { version = "0.65.0", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
futures-util = { version = "0.3.34", default-features = false }
# Client side of the daemon socket for the CLI; already in the tree through axum.
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
rustix = { version = "1.1.6", features = ["fs", "process"] }
tokio = { version = "1.54.1", features = ["net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread"] }
tempfile = "3.27.0"
